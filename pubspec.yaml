name: habitbet
description: "HabitBet — habit tracker with money stakes and social arbitration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.2.1

  # Routing
  go_router: ^17.1.0

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1
  firebase_storage: ^13.0.6

  # Auth providers
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # Payments
  flutter_stripe: ^12.2.0

  # Image
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

  # Notifications
  flutter_local_notifications: ^20.1.0

  # Utils
  share_plus: ^12.0.1
  intl: ^0.20.2
  uuid: ^4.5.2
  cloud_functions: ^6.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
